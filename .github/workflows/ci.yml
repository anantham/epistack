name: Epistack checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Build, tests, coverage, integration, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck, build, and deterministic tests
        run: npm test
      - name: Measure deterministic test coverage
        run: npm run test:coverage
      - name: Exercise the real Worker and D1 runtime
        run: npm run test:integration
      - name: Lint source
        run: npm run lint

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke suite
        run: npm run test:browser
